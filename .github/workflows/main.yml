name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test reconciliation, GUI, and upload changes
        run: go test -count=1 ./internal/reconcile/... ./internal/pcscommand ./internal/pcsfunctions/pcsupload
      - name: Build all packages
        run: go build ./...
